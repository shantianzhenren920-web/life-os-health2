const KEY='life-os-new-v2';const init=()=>({settings:{theme:'dark',kcal:2150,p:140,f:60,c:250,weightGoal:68,height:170,fontSize:100},food:[],body:[],exercises:[],workouts:[]});let db;try{db={...init(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{db=init()}let date=iso(new Date()),page='today',detail='',monthMode=false,monthCursor=date.slice(0,7),metric={food:'kcal',body:'weight',workout:'volume',exercise:'max'},range=30,chosenExercise='';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function add(d,n){let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return iso(x)}function num(x){return Number(x)||0}function fmt(x,n=1){return Number.isFinite(x)?Number(x).toFixed(n):'—'}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function navigate(p){page=p;detail='';render()}function goDetail(d){detail=d;page='today';render()}function selected(d){date=d;monthCursor=d.slice(0,7);render()}function btn(t,fn,cls=''){return `<button type="button" class="${cls}" onclick="${fn}">${t}</button>`}function card(content,click=''){return `<section class="card ${click?'tap':''}" ${click?`onclick="${click}"`:''}>${content}</section>`}function bars(vals){return [['kcal','kcal','var(--accent)'],['p','P','var(--green)'],['f','F','var(--orange)'],['c','C','var(--purple)']].map(([k,t,color])=>`<div class="metric"><span>${t}</span><span>${fmt(vals[k],k==='kcal'?0:1)} / ${db.settings[k]} ${k==='kcal'?'kcal':'g'}</span></div><div class="track"><div class="fill" style="width:${Math.min(100,100*num(vals[k])/Math.max(1,num(db.settings[k])))}%;background:${color}"></div></div>`).join('')}function foods(d){return db.food.filter(x=>x.date===d).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}function totalFood(d){return foods(d).flatMap(x=>x.items||[]).reduce((a,x)=>{for(const k of ['kcal','p','f','c'])a[k]+=num(x[k]);return a},{kcal:0,p:0,f:0,c:0})}function body(d){return db.body.find(x=>x.date===d)}function priorAvg(d,k){const arr=db.body.filter(x=>x.date<d&&x.date>=add(d,-7)&&x[k]!==''&&x[k]!=null);return arr.length?arr.reduce((s,x)=>s+num(x[k]),0)/arr.length:null}function workout(d){return db.workouts.find(x=>x.date===d)}function ex(id){return db.exercises.find(x=>x.id===id)||{name:'不明な種目',part:'未設定'}}function vol(w){return (w?.entries||[]).reduce((s,e)=>s+(e.sets||[]).filter(x=>!x.warmup).reduce((a,x)=>a+num(x.weight)*num(x.reps),0),0)}function parts(w){return [...new Set((w?.entries||[]).map(e=>ex(e.exerciseId).part))].join('・')||'—'}function calendar(){let h=`<div class="row"><h2 style="margin:0">${esc(date)} <span class="muted small">${'日月火水木金土'[new Date(date+'T12:00').getDay()]}曜日</span></h2>${btn('今日','selected(iso(new Date()))','pill')} ${btn(monthMode?'週表示':'月表示','monthMode=!monthMode;render()','pill')}</div>`;if(!monthMode){h+='<div class="calendar" id="weekstrip">';for(let i=-105;i<=105;i++){let d=add(date,i);h+=`<button data-offset="${i}" class="day ${i===0?'active':''}" onclick="selected('${d}')">${'日月火水木金土'[new Date(d+'T12:00').getDay()]}<strong>${+d.slice(8)}</strong></button>`}h+='</div>'}else{let [y,m]=monthCursor.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();h+=`<div class="row">${btn('‹ 前月','changeMonth(-1)')}<strong>${y}年 ${m}月</strong>${btn('翌月 ›','changeMonth(1)')}</div><div class="month">`;for(const x of '日月火水木金土')h+=`<span>${x}</span>`;for(let i=0;i<first;i++)h+='<span></span>';for(let i=1;i<=days;i++){let d=`${y}-${String(m).padStart(2,'0')}-${String(i).padStart(2,'0')}`;h+=`<button class="${d===date?'active':''}" onclick="selected('${d}')">${i}</button>`}h+='</div>'}return card(h)}function changeMonth(n){let [y,m]=monthCursor.split('-').map(Number),d=new Date(y,m-1+n,1);monthCursor=iso(d).slice(0,7);render()}function home(){let f=totalFood(date),b=body(date),w=workout(date),v=vol(w);return calendar()+card(`<div class="row"><h3>🍽 食事</h3><span class="muted">詳細 ›</span></div>${bars(f)}<p class="muted small">${foods(date).length} 回の食事</p>`,`goDetail('food')`)+card(`<div class="row"><h3>⚖ 身体</h3><span class="muted">詳細 ›</span></div><div class="grid3">${[['weight','体重','kg'],['fat','体脂肪率','%'],['muscle','筋肉率','%']].map(([k,t,u])=>`<div class="stat"><span class="small muted">${t}</span><b>${b&&b[k]!==''?fmt(num(b[k])):'—'}<small>${b&&b[k]!==''?u:''}</small></b><span class="small muted">7日平均 ${priorAvg(date,k)===null?'—':fmt(priorAvg(date,k))}${u}${!b||b[k]===''||b[k]==null||priorAvg(date,k)===null?'':`<span class="delta ${num(b[k])>priorAvg(date,k)?'up':num(b[k])<priorAvg(date,k)?'down':'same'}">平均との差 ${num(b[k])-priorAvg(date,k)>0?'+':''}${fmt(num(b[k])-priorAvg(date,k))}${k==='weight'?'kg':'pt'}</span>`}</span></div>`).join('')}</div>`,`goDetail('body')`)+card(`<div class="row"><h3>💪 筋トレ</h3><span class="muted">詳細 ›</span></div><div class="big">${fmt(v,0)} <small>kg</small></div><p class="muted">部位：${esc(parts(w))}</p><span class="small muted">${w?.entries?.length||0} 種目</span>`,`goDetail('workout')`)}function back(){return btn('‹ 今日のデータ',"detail='';render()",'ghost')}function foodDetail(){let f=totalFood(date),a=foods(date);return back()+`<h2>🍽 食事記録 <span class="small muted">${date}</span></h2>`+card(bars(f))+['朝食','昼食','夕食','間食'].map(t=>card(`<div class="row"><h3>${t}</h3>${btn('＋ 食事を追加',`editMeal('', '${t}')`,'pill')}</div>${a.filter(x=>x.type===t).map(x=>`<div class="foodline"><div class="row"><strong>${esc(x.time||'時間未設定')}</strong>${btn('編集',`editMeal('${x.id}')`,'pill')}</div>${x.photo?`<img class="meal-photo" src="${esc(x.photo)}" alt="食事の写真">`:''}${(x.items||[]).map(i=>`<div class="row small" style="padding:5px 0"><span>${esc(i.name)} ${esc(i.amount)}</span><span>${fmt(num(i.kcal),0)} kcal / P${fmt(num(i.p))} F${fmt(num(i.f))} C${fmt(num(i.c))}</span></div>`).join('')}</div>`).join('')||'<p class="muted small">記録なし</p>'}`)).join('')+btn('食事の分析を見る',"page='analysis';detail='';analysisTab='food';render()",'primary')}function bodyMetric(b,k){if(!b)return null;const valid=x=>x!==''&&x!=null&&Number.isFinite(Number(x));let w=valid(b.weight)?Number(b.weight):null,f=valid(b.fat)?Number(b.fat):null,m=valid(b.muscle)?Number(b.muscle):null,h=Number(db.settings.height)/100;switch(k){case 'weight':return w;case 'fat':return f;case 'muscle':return m;case 'mass':return w!==null&&m!==null?w*m/100:null;case 'bmi':return w!==null&&h>0?w/(h*h):null;case 'lean':return w!==null&&f!==null?w*(1-f/100):null;default:return null}}function bodyMetricAvg(d,k){let a=db.body.filter(x=>x.date<d&&x.date>=add(d,-7)).map(x=>bodyMetric(x,k)).filter(x=>x!==null&&Number.isFinite(x));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null}function bodyDetail(){let b=body(date),spec=[['weight','体重','kg'],['fat','体脂肪率','%'],['muscle','筋肉率','%'],['mass','筋肉量','kg'],['bmi','BMI',''],['lean','除脂肪体重','kg']];return back()+`<h2>⚖ 身体記録 <span class="small muted">${date}</span></h2>`+card(`<div class="row"><strong>詳細データ</strong>${btn(b?'編集':'＋ 記録を追加','editBody()','primary')}</div><p class="muted small">過去7日平均は選択日の前日までの記録日から算出します。</p>${spec.map(([k,t,u])=>{let v=bodyMetric(b,k),avg=bodyMetricAvg(date,k),diff=v!==null&&avg!==null?v-avg:null,unit=k==='fat'||k==='muscle'?'pt':u;return `<div class="stat" style="margin-top:10px"><span class="muted">${t}</span><div class="row wrap" style="align-items:flex-start"><b style="font-size:1.25rem">${v===null?'—':fmt(v)}${v===null?'':u?' '+u:''}</b><div class="small muted" style="text-align:right;line-height:1.8">過去7日平均 ${avg===null?'—':fmt(avg)+(u?' '+u:'')}<br>平均との差 <strong style="color:var(--text)">${diff===null?'—':(diff>0?'+':'')+fmt(diff)+(unit?' '+unit:'')}</strong></div></div></div>`}).join('')}`)+btn('身体の分析を見る',"page='analysis';detail='';analysisTab='body';render()",'primary')}function workoutDetail(){let w=workout(date);return back()+`<h2>💪 筋トレ記録 <span class="small muted">${date}</span></h2>`+card(`<div class="row"><div><div class="muted small">メインセット総重量</div><div class="big">${fmt(vol(w),0)} kg</div><div class="muted small">部位：${esc(parts(w))}</div></div>${btn('＋ 種目追加','addEntry()','primary')}</div>`)+(w?.entries||[]).map(e=>card(`<div class="row"><div><h3>${esc(ex(e.exerciseId).name)}</h3><span class="small muted">${esc(ex(e.exerciseId).part)}</span></div>${btn('編集',`editEntry('${e.id}')`,'pill')}</div>${(e.sets||[]).map((s,i)=>`<div class="setline row small"><span>${s.warmup?'W':i+1}</span><strong>${fmt(num(s.weight))} kg × ${fmt(num(s.reps),0)} 回</strong></div>`).join('')}<p class="muted small note">${esc(e.note||'')}</p>`)).join('')+card(`<h3>今日のメモ</h3><p class="note">${esc(w?.note||'未入力')}</p>${btn('メモを編集','editWorkoutNote()','pill')}`)+btn('筋トレの分析を見る',"page='analysis';detail='';analysisTab='workout';render()",'primary')}function modal(html){$('#modal').innerHTML='<div class="modal-toolbar"><button type="button" class="ghost" onclick="closeModal()">✕ キャンセルして戻る</button></div>'+html;$('#modal').showModal()}function closeModal(){ $('#modal').close()}let mealPhotoDraft='';function editMeal(id='',type='朝食'){let old=db.food.find(x=>x.id===id),x=old||{type,time:'',items:[{name:'',amount:'',kcal:'',p:'',f:'',c:''}]};mealPhotoDraft=x.photo||'';modal(`<h2>${old?'食事を編集':'食事を追加'}</h2><form id="mealForm" onsubmit="saveMeal(event,'${id}')"><label>区分</label><select name="type">${['朝食','昼食','夕食','間食'].map(t=>`<option ${t===x.type?'selected':''}>${t}</option>`).join('')}</select><label>時間（任意）</label><input type="time" name="time" value="${esc(x.time)}"><label>食事の写真（任意・1枚）</label><div id="mealPhotoPreview">${mealPhotoDraft?`<img class="meal-photo photo-preview" src="${esc(mealPhotoDraft)}" alt="登録写真">`:'<span class="muted small">写真なし</span>'}</div><input type="file" accept="image/*" capture="environment" onchange="chooseMealPhoto(event)"><div class="actions">${btn('写真を削除','removeMealPhoto()','pill')}</div><div id="mealItems">${x.items.map((i,j)=>itemFields(i,j)).join('')}</div><div class="actions">${btn('＋ 食品を追加','appendItem()')}</div><div class="actions"><button class="primary">保存</button><button type="button" onclick="closeModal()">キャンセル</button>${old?btn('食事を削除',`deleteMeal('${id}')`,'danger'):''}</div></form>`)}function removeMealPhoto(){mealPhotoDraft='';refreshMealPhoto()}function refreshMealPhoto(){let el=$('#mealPhotoPreview');if(el)el.innerHTML=mealPhotoDraft?`<img class="meal-photo photo-preview" src="${esc(mealPhotoDraft)}" alt="登録写真">`:'<span class="muted small">写真なし</span>'}async function chooseMealPhoto(ev){let file=ev.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/'))return alert('画像ファイルを選んでください');try{let url=URL.createObjectURL(file),img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});let scale=Math.min(1,1000/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);mealPhotoDraft=canvas.toDataURL('image/jpeg',.7);URL.revokeObjectURL(url);refreshMealPhoto()}catch(e){alert('写真を読み込めませんでした：'+e.message)}}function itemFields(i,j){return `<div class="card meal-item"><div class="row"><strong>食品</strong><button type="button" class="danger" onclick="this.closest('.meal-item').remove()">削除</button></div><label>食品名</label><input name="name" value="${esc(i.name)}" required><label>量（例：150g）</label><input name="amount" value="${esc(i.amount)}"><div class="formrow four">${['kcal','p','f','c'].map(k=>`<div><label>${k==='kcal'?'kcal':k.toUpperCase()+' (g)'}</label><input type="number" step="any" min="0" name="${k}" value="${esc(i[k])}"></div>`).join('')}</div></div>`}function appendItem(){$('#mealItems').insertAdjacentHTML('beforeend',itemFields({name:'',amount:'',kcal:'',p:'',f:'',c:''},0))}function saveMeal(ev,id){ev.preventDefault();let form=ev.target,items=[...form.querySelectorAll('.meal-item')].map(el=>Object.fromEntries(['name','amount','kcal','p','f','c'].map(k=>[k,el.querySelector(`[name="${k}"]`).value])));if(!items.length)return alert('食品を1つ以上登録してください');let obj={id:id||crypto.randomUUID(),date,type:form.elements.namedItem("type").value,time:form.elements.namedItem("time").value,items,photo:mealPhotoDraft};db.food=db.food.filter(x=>x.id!==id);db.food.push(obj);save();closeModal();render()}function deleteMeal(id){if(confirm('この食事を削除しますか？')){db.food=db.food.filter(x=>x.id!==id);save();closeModal();render()}}function editBody(){let b=body(date)||{};modal(`<h2>身体記録</h2><form onsubmit="saveBody(event)">${[['weight','体重 (kg)'],['fat','体脂肪率 (%)'],['muscle','筋肉率 (%)']].map(([k,t])=>`<label>${t}</label><input type="number" name="${k}" min="0" step="any" value="${esc(b[k]??'')}">`).join('')}<p class="muted small">筋肉量は体重 × 筋肉率で自動計算します。</p><div class="actions"><button class="primary">保存</button>${body(date)?btn('記録を削除','deleteBody()','danger'):''}</div></form>`)}function saveBody(ev){ev.preventDefault();let f=ev.target;db.body=db.body.filter(x=>x.date!==date);if(['weight','fat','muscle'].some(k=>f[k].value!==''))db.body.push({date,...Object.fromEntries(['weight','fat','muscle'].map(k=>[k,f[k].value]))});save();closeModal();render()}function deleteBody(){if(confirm('身体記録を削除しますか？')){db.body=db.body.filter(x=>x.date!==date);save();closeModal();render()}}function ensureWorkout(){let w=workout(date);if(!w){w={date,entries:[],note:''};db.workouts.push(w)}return w}function addEntry(){let options=db.exercises.map(x=>`<option value="${x.id}">${esc(x.name)}（${esc(x.part)}）</option>`).join('');modal(`<h2>種目を追加</h2><label>登録済み種目</label><select id="exercisePick"><option value="">選択してください</option>${options}</select><div class="actions">${btn('新しい種目を登録','registerExercise()')}</div><div class="actions">${btn('この種目を追加','commitEntry()','primary')}</div>`)}function registerExercise(){modal(`<h2>種目登録</h2><form onsubmit="saveExercise(event)"><label>種目名</label><input name="name" required><label>主な部位</label><select name="part">${['胸','背中','脚','肩','腕','腹','全身','その他'].map(x=>`<option>${x}</option>`).join('')}</select><div class="actions"><button class="primary">登録して追加</button>${btn('戻る','addEntry()')}</div></form>`)}function saveExercise(ev){ev.preventDefault();let f=ev.target,x={id:crypto.randomUUID(),name:f.name.value.trim(),part:f.part.value};db.exercises.push(x);let e={id:crypto.randomUUID(),exerciseId:x.id,sets:[],note:''};ensureWorkout().entries.push(e);save();editEntry(e.id)}function commitEntry(){let id=$('#exercisePick').value;if(!id)return alert('種目を選択してください');let e={id:crypto.randomUUID(),exerciseId:id,sets:[],note:''};ensureWorkout().entries.push(e);save();editEntry(e.id)}function editEntry(id){let e=ensureWorkout().entries.find(x=>x.id===id);modal(`<h2>${esc(ex(e.exerciseId).name)}</h2><form onsubmit="saveEntry(event,'${id}')"><div id="sets">${e.sets.map(s=>setFields(s)).join('')}</div><div class="actions">${btn('＋ セット追加','appendSet()')}</div><label>種目メモ</label><textarea name="note" rows="3">${esc(e.note)}</textarea><div class="actions"><button class="primary">保存</button>${btn('種目を削除',`deleteEntry('${id}')`,'danger')}</div></form>`)}function setFields(s={weight:'',reps:'',warmup:false}){return `<div class="setline set-edit"><div class="formrow three"><div><label>重量 kg</label><input name="weight" type="number" min="0" step="any" value="${esc(s.weight)}"></div><div><label>回数</label><input name="reps" type="number" min="0" step="1" value="${esc(s.reps)}"></div><div><label>種別</label><select name="warmup"><option value="false" ${!s.warmup?'selected':''}>メイン</option><option value="true" ${s.warmup?'selected':''}>W 準備</option></select></div></div><button type="button" class="danger pill" onclick="this.closest('.set-edit').remove()">セット削除</button></div>`}function appendSet(){$('#sets').insertAdjacentHTML('beforeend',setFields())}function saveEntry(ev,id){ev.preventDefault();let e=ensureWorkout().entries.find(x=>x.id===id);e.sets=[...ev.target.querySelectorAll('.set-edit')].map(x=>({weight:x.querySelector('[name="weight"]').value,reps:x.querySelector('[name="reps"]').value,warmup:x.querySelector('[name="warmup"]').value==='true'}));e.note=ev.target.note.value;save();closeModal();render()}function deleteEntry(id){if(confirm('この種目の記録を削除しますか？')){ensureWorkout().entries=ensureWorkout().entries.filter(x=>x.id!==id);save();closeModal();render()}}function editWorkoutNote(){modal(`<h2>今日のメモ</h2><textarea id="workNote" rows="6">${esc(workout(date)?.note||'')}</textarea><div class="actions">${btn('保存','saveWorkoutNote()','primary')}</div>`)}function saveWorkoutNote(){ensureWorkout().note=$('#workNote').value;save();closeModal();render()}
let analysisTab='food';function analytics(){let tabs=['food','body','workout'],names=['食事','身体','筋トレ'];let h=`<h2>📈 分析</h2><div class="pills">${tabs.map((t,i)=>btn(names[i],`analysisTab='${t}';render()`,`pill ${analysisTab===t?'active':''}`)).join('')}</div><div class="card"><div class="pills">${[[7,'7日'],[30,'30日'],[90,'90日'],[365,'1年'],[0,'全期間']].map(([v,t])=>btn(t,`range=${v};render()`,`pill ${range===v?'active':''}`)).join('')}</div></div>`;if(analysisTab==='food'){h+=metricPills('food',[['kcal','カロリー'],['p','P'],['f','F'],['c','C']]);let data=groupDays(db.food.map(x=>x.date),d=>totalFood(d)[metric.food]);h+=chartCard(data,db.settings[metric.food]);let a=filterPeriod(data).map(x=>x.v);h+=card(`<div class="muted small">期間内の記録日平均</div><div class="big">${a.length?fmt(a.reduce((s,v)=>s+v,0)/a.length):'—'} ${metric.food==='kcal'?'kcal':'g'}</div>`)}else if(analysisTab==='body'){h+=metricPills('body',[['weight','体重'],['fat','体脂肪率'],['muscle','筋肉率'],['mass','筋肉量']]);let data=db.body.map(x=>({date:x.date,v:metric.body==='mass'?num(x.weight)*num(x.muscle)/100:x[metric.body]===''?NaN:num(x[metric.body])})).filter(x=>Number.isFinite(x.v)).sort((a,b)=>a.date.localeCompare(b.date));h+=chartCard(data);let f=filterPeriod(data),last=f.at(-1)?.v,first=f[0]?.v;h+=card(`<div class="grid3"><div class="stat"><span class="muted small">最新</span><b>${last==null?'—':fmt(last)}</b></div><div class="stat"><span class="muted small">平均</span><b>${f.length?fmt(f.reduce((s,x)=>s+x.v,0)/f.length):'—'}</b></div><div class="stat"><span class="muted small">変化</span><b>${last==null?'—':fmt(last-first)}</b></div></div>`)+card(`<h3>直近7件の身体記録</h3>${db.body.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7).map(x=>`<div class="history tap" onclick="date='${x.date}';goDetail('body')">${x.date}　${esc(x.weight)}kg / ${esc(x.fat)}% / ${esc(x.muscle)}% ›</div>`).join('')||'<div class="empty">記録なし</div>'}`)}else{h+=metricPills('workout',[['volume','総重量']]);let data=db.workouts.map(x=>({date:x.date,v:vol(x)})).sort((a,b)=>a.date.localeCompare(b.date));h+=chartCard(data);h+=card(`<h3>直近7回の筋トレ</h3>${db.workouts.filter(x=>x.entries.length).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7).map(x=>`<div class="history tap" onclick="date='${x.date}';goDetail('workout')"><strong>${x.date}</strong>　${fmt(vol(x),0)}kg<br><span class="muted small">${esc(parts(x))} · ${x.entries.map(e=>esc(ex(e.exerciseId).name)).join('、')}</span> ›</div>`).join('')||'<div class="empty">記録なし</div>'}`);h+=card(`<h3>種目別分析</h3><label>種目を選択</label><select onchange="chosenExercise=this.value;render()"><option value="">選択してください</option>${db.exercises.map(x=>`<option value="${x.id}" ${chosenExercise===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${chosenExercise?exerciseAnalytics():''}`)}return h}function metricPills(type,options){return `<div class="pills" style="margin-top:14px">${options.map(([k,t])=>btn(t,`metric.${type}='${k}';render()`,`pill ${metric[type]===k?'active':''}`)).join('')}</div>`}function groupDays(days,fn){return [...new Set(days)].sort().map(d=>({date:d,v:fn(d)}))}function filterPeriod(data){let cutoff=range?add(iso(new Date()),-range+1):'0000-01-01';return data.filter(x=>x.date>=cutoff&&x.date<=iso(new Date()))}function chartCard(data,goal=null){let d=filterPeriod(data);let h=card(`<div class="row"><strong>推移グラフ</strong><span class="muted small">${d.length} 記録日</span></div><canvas id="plot" width="680" height="240"></canvas><div class="muted small" id="pointInfo">グラフの点をタップすると数値を表示</div>${goal!=null?`<div class="muted small">点線：目標 ${goal}</div>`:''}`);requestAnimationFrame(()=>drawChart(d,goal));return h}function drawChart(data,goal){let c=$('#plot');if(!c)return;let ctx=c.getContext('2d'),W=c.width,H=c.height;ctx.clearRect(0,0,W,H);let values=data.map(x=>x.v);if(goal!=null)values.push(goal);if(!values.length){ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--sub');ctx.font='20px sans-serif';ctx.fillText('この期間の記録はありません',170,120);return}let lo=Math.min(...values),hi=Math.max(...values),pad=(hi-lo||1)*.2;lo-=pad;hi+=pad;let x=i=>45+(W-75)*(data.length===1?.5:i/(data.length-1)),y=v=>H-35-(v-lo)/(hi-lo)*(H-65);ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--line');for(let i=0;i<4;i++){let yy=20+i*(H-55)/3;ctx.beginPath();ctx.moveTo(45,yy);ctx.lineTo(W-15,yy);ctx.stroke()}ctx.font='13px sans-serif';ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--sub');ctx.fillText(fmt(hi),4,24);ctx.fillText(fmt(lo),4,H-34);if(goal!=null){ctx.setLineDash([7,6]);ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--orange');ctx.beginPath();ctx.moveTo(45,y(goal));ctx.lineTo(W-15,y(goal));ctx.stroke();ctx.setLineDash([])}ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--accent');ctx.lineWidth=3;ctx.beginPath();data.forEach((p,i)=>i?ctx.lineTo(x(i),y(p.v)):ctx.moveTo(x(i),y(p.v)));ctx.stroke();data.forEach((p,i)=>{ctx.beginPath();ctx.arc(x(i),y(p.v),5,0,7);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--accent');ctx.fill()});if(data.length){ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--sub');ctx.fillText(data[0].date.slice(5),45,H-9);ctx.fillText(data.at(-1).date.slice(5),W-65,H-9)}c.onclick=e=>{let rect=c.getBoundingClientRect(),px=(e.clientX-rect.left)*W/rect.width,idx=data.reduce((best,p,i)=>Math.abs(x(i)-px)<Math.abs(x(best)-px)?i:best,0);$('#pointInfo').textContent=`${data[idx].date}：${fmt(data[idx].v,2)}`}}function exerciseAnalytics(){let entries=db.workouts.flatMap(w=>w.entries.filter(e=>e.exerciseId===chosenExercise).map(e=>({date:w.date,sets:e.sets}))).sort((a,b)=>a.date.localeCompare(b.date));let points=entries.map(e=>{let s=e.sets.filter(x=>!x.warmup);return {date:e.date,max:Math.max(0,...s.map(x=>num(x.weight))),rm:Math.max(0,...s.map(x=>num(x.weight)*(1+num(x.reps)/30))),volume:s.reduce((v,x)=>v+num(x.weight)*num(x.reps),0)}});let h=`<div class="pills" style="margin-top:14px">${[['max','最大重量'],['rm','推定1RM'],['volume','総重量']].map(([k,t])=>btn(t,`metric.exercise='${k}';render()`,`pill ${metric.exercise===k?'active':''}`)).join('')}</div>`;h+=chartCard(points.map(x=>({date:x.date,v:x[metric.exercise]})));h+=`<h3 style="margin-top:18px">この種目の直近7回</h3>${entries.slice(-7).reverse().map(e=>`<div class="history tap" onclick="date='${e.date}';goDetail('workout')"><strong>${e.date}</strong><br>${e.sets.map(s=>`${s.warmup?'W ':''}${esc(s.weight)}kg×${esc(s.reps)}回`).join(' / ')} ›</div>`).join('')||'<p class="muted">記録なし</p>'}`;return h}function openSettings(){modal(`<h2>⚙ 設定</h2><label>テーマ</label><select id="theme" onchange="db.settings.theme=this.value;save();applyTheme()"><option value="dark" ${db.settings.theme==='dark'?'selected':''}>ダーク</option><option value="light" ${db.settings.theme==='light'?'selected':''}>ライト</option></select><label>文字サイズ</label><select id="fontSize" onchange="db.settings.fontSize=Number(this.value);save();applyTheme()">${[[80,'極小（80%）'],[90,'小（90%）'],[100,'標準（100%）'],[110,'大（110%）'],[125,'特大（125%）']].map(([v,t])=>`<option value="${v}" ${Number(db.settings.fontSize||100)===v?'selected':''}>${t}</option>`).join('')}</select><form onsubmit="saveSettings(event)">${[['kcal','目標カロリー (kcal)'],['p','目標タンパク質 (g)'],['f','目標脂質 (g)'],['c','目標炭水化物 (g)'],['weightGoal','目標体重 (kg)'],['height','身長 (cm) ※BMI計算に使用']].map(([k,t])=>`<label>${t}</label><input type="number" min="0" step="any" name="${k}" value="${esc(db.settings[k])}">`).join('')}<div class="actions"><button class="primary">目標を保存</button></div></form><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>データの管理</h3><p class="muted small">新アプリの保存領域は旧版とは別です。旧版のJSONは自動移行しません。</p><div class="actions">${btn('JSONバックアップを書き出す','exportData()')}<label style="margin:0"><span class="pill" style="display:inline-block;border:1px solid var(--line);padding:10px">JSONを読み込む</span><input type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></label></div>`)}function saveSettings(ev){ev.preventDefault();for(let k of ['kcal','p','f','c','weightGoal','height'])db.settings[k]=num(ev.target[k].value);save();closeModal();render()}function applyTheme(){document.body.classList.toggle('light',db.settings.theme==='light');document.documentElement.style.fontSize=(16*([80,90,100,110,125].includes(Number(db.settings.fontSize))?Number(db.settings.fontSize):100)/100)+'px'}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download=`life-os-new-${iso(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(ev){try{let x=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(x.food)||!Array.isArray(x.body)||!Array.isArray(x.workouts)||!Array.isArray(x.exercises))throw Error('新形式のJSONではありません');if(!confirm('現在の新アプリの記録をすべて置き換えます。続けますか？'))return;db={...init(),...x};save();applyTheme();closeModal();render()}catch(e){alert('読み込み失敗：'+e.message)}}function render(){applyTheme();$('#navToday').classList.toggle('active',page==='today');$('#navAnalysis').classList.toggle('active',page==='analysis');$('#app').innerHTML=page==='analysis'?analytics():detail==='food'?foodDetail():detail==='body'?bodyDetail():detail==='workout'?workoutDetail():home();if(!monthMode&&page==='today'&&!detail){let s=$('#weekstrip');s?.querySelector('[data-offset="0"]')?.scrollIntoView({block:'nearest',inline:'center'})}}render();
</script><script>if ("serviceWorker" in navigator && location.protocol !== "file:") { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.warn)); }</script></body></html>
